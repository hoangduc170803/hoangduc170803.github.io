  summary: >-
    Data engineer at Viettel Telecom, where I rebuilt the pipelines behind a company-wide fee settlement
    system. At Aubot, I took a multi-agent path finding planner from recent literature into production on a
    live AGV fleet. I want to keep working at that intersection: the data infrastructure that makes large
    models work, from the pipelines that train them to the systems that serve them.

