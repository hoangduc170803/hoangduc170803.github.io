  sections:
    Education:
      - institution: FPT University
        location: Hanoi, Vietnam
        url: https://hanoi.fpt.edu.vn/
        area: Information Technology (Software Engineering)
        studyType: BSc
        start_date: 2022
        end_date: 2026-08
        score: GPA 8.08/10
        courses: "Statistics and Probability; Discrete Mathematics; Data Structures and Algorithms; Introduction to Databases; Operating Systems; Computer Organization and Architecture; Computer Networking; Internet of Things"
        highlights:
          - "Graduation capstone project: SWES - Smart Warehouse Execution System (Multi-AGV Orchestration), graded 9.0/10 (A+)."

    Experience:
      - company: Viettel Telecom
        location: Hanoi, Vietnam
        position: Data Engineer
        start_date: 2025-07
        end_date: present
        highlights:
          - Sales Fee System v3 could only settle fees monthly: data left the Data Lake as TXT files and was enriched and aggregated inside Oracle.
          - Rebuilt the pipeline on the Data Lakehouse, with Apache Spark handling aggregation, enrichment and fee calculation across terabytes of data. Pipeline runtime fell from over 30 minutes to under 8 minutes, and settlement moved from monthly to daily.
          - Migrated 17 tables from v3 with Apache Hop and consolidated external sources through Apache NiFi, with data integrity preserved across the cutover.
          - Deployed a phone number masking system in partnership with China-ASEAN Information Harbor Co., Ltd., configuring the KrakenD API Gateway and streaming logs into the ELK stack through Fluentd.

      - company: Viettel Group
        location: Hanoi, Vietnam
        position: Data Engineering Intern, Viettel Digital Talent Program (DS/AI Track)
        start_date: 2025-04
        end_date: 2025-06
        highlights:
          - Built ETL workflows following the Medallion architecture (Bronze/Silver/Gold) on Databricks, using Spark SQL to transform data across each layer.
          - Applied fine-grained access control with Apache Ranger, Databricks Unity Catalog and lakeFS.
          - Developed a hybrid RAG system that answers staff questions on which company-issued policy applies, returning the governing policy document with traceable citations.

    Projects:
      - name: SWES - Smart Warehouse Execution System (Multi-AGV Orchestration)
        date: 2026-06 to 2026-08
        highlights:
          - Research and Development, Multi-Agent Path Finding at Aubot (CF Group). Graduation capstone project.
          - openTCS ships with a Dijkstra router that plans each vehicle independently, which left the AGVs deadlocking against one another in regular operation.
          - Built a joint multi-agent planner in the openTCS Java kernel, evolving from PIBT to LaCAM and LaCAM*, extended to continuous order arrival with LLLG local guidance (SoCS-26) and an Action Dependency Graph against corridor deadlock.
          - Ported these undirected-graph algorithms onto a directed industrial roadmap with vehicle footprints and headings, and replaced greedy assignment with global min-cost matching (Hungarian algorithm) on road-graph distances.
          - Deployed on Aubot's live AGV fleet.

      - name: Hybrid RAG System
        date: 2025-04 to 2025-06
        highlights:
          - Built at the Viettel Digital Talent Program with Python, FastAPI, Streamlit, Milvus, MinIO, Docker, BGE-M3 and Gemma 3.
          - Answers staff questions on which company-issued policy applies, returning the governing policy document with traceable citations.
          - Indexed documents with BGE-M3 embeddings (1024-dim) in Milvus and combined dense vector search with BM25 sparse search, improving recall and ranking quality.
          - Integrated Gemma 3 models as the generative backbone and benchmarked performance across model sizes.

      - name: NYC Taxi Data Pipeline
        date: ""
        highlights:
          - Built an automated pipeline for NYC taxi trip data on Google Cloud, provisioning all resources with Terraform for reproducibility.
          - Orchestrated ingestion and transformation with an Apache Airflow DAG, loading results into BigQuery and modeling them with dbt.
          - Processed large-scale trip data with Apache Spark and implemented real-time streaming with Apache Kafka and Apache Flink.

    Awards:
      - name: Viettel Digital Talent Program, Data Engineer (DS/AI Track)
        date: 2025
        summary: Selected in the top 3.6% of 5,700+ applicants nationwide, advanced to the full-time phase, and offered full-time employment while still in the third year of university.

      - name: Honorable Student of the Semester, FPT University
        date: 2023 - 2024
